<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoopKit Basic Artifact</title>

  <script type="application/loopkit+json" id="loopkit-meta">
  {
    "artifactId": "loopkit-basic-example",
    "artifactVersion": "v1",
    "title": "LoopKit Basic Artifact",
    "description": "Минимальный HTML-артефакт для проверки LoopKit."
  }
  </script>

  <script type="text/plain" id="loopkit-decisions">
DECISIONS:
- Артефакт должен оставаться простым одиночным HTML.
- Feedback bundle живёт одну итерацию.
- Между версиями сохраняются только DECISIONS.
  </script>

  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f3ed; color: #171717; }
    main { width: min(760px, calc(100vw - 32px)); background: #fff; border: 1px solid #e6dfd4; border-radius: 28px; padding: 34px; box-shadow: 0 18px 55px rgba(0,0,0,.07); }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 5vw, 58px); line-height: .95; letter-spacing: -.055em; }
    p { font-size: 19px; line-height: 1.5; color: #555; margin: 0 0 22px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button.demo { height: 40px; border: 0; border-radius: 14px; padding: 0 16px; background: #171717; color: #fff; font-weight: 700; cursor: pointer; }
    button.demo.secondary { background: #eee8df; color: #171717; }
  </style>
</head>
<body>
  <main data-loop-id="basic.card" data-loop-kind="card" data-loop-title="Main card">
    <p data-loop-id="basic.kicker" data-loop-kind="kicker" data-loop-title="Kicker">LoopKit example</p>
    <h1 data-loop-id="basic.title" data-loop-kind="heading" data-loop-title="Main title">Кликни элемент и оставь фидбэк</h1>
    <p data-loop-id="basic.description" data-loop-kind="paragraph" data-loop-title="Description">
      Нажми Mark up в панели LoopKit, выбери конкретный элемент и напиши комментарий. Потом нажми Copy bundle и вставь результат в любой AI-чат.
    </p>
    <div class="actions" data-loop-id="basic.actions" data-loop-kind="actions" data-loop-title="Action buttons">
      <button class="demo" data-loop-id="basic.primary-action" data-loop-kind="button" data-loop-title="Primary action">Главное действие</button>
      <button class="demo secondary" data-loop-id="basic.secondary-action" data-loop-kind="button" data-loop-title="Secondary action">Второе действие</button>
    </div>
  </main>

  <script src="../loopkit.js"></script>
</body>
</html>
