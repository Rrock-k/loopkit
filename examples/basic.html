<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoopKit Basic Artifact</title>

  <script type="application/loopkit+json">
  {
    "artifact_id": "loopkit-basic-example",
    "artifact_version": "v1",
    "title": "LoopKit Basic Artifact"
  }
  </script>

  <script type="text/plain" id="loopkit-decisions">
  DECISIONS:
  - один самодостаточный HTML-артефакт
  - минималистичный интерфейс
  - фидбэк живёт одну итерацию
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f4ee;
      color: #151515;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(760px, calc(100vw - 32px));
      background: white;
      border: 1px solid #e8dfd2;
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 16px 50px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 14px; font-size: 42px; letter-spacing: -.04em; }
    p { margin: 0 0 18px; font-size: 20px; line-height: 1.45; color: #444; }
    button.demo {
      border: 0;
      border-radius: 16px;
      background: #111;
      color: white;
      padding: 14px 18px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main data-loop-id="basic.card" data-loop-kind="card" data-loop-title="Main card">
    <h1 data-loop-id="basic.title" data-loop-kind="heading" data-loop-title="Hero title">LoopKit artifact</h1>
    <p data-loop-id="basic.description" data-loop-kind="paragraph" data-loop-title="Description">
      Это минимальный HTML-артефакт: открой Mark up, кликни элемент, оставь фидбэк и экспортируй bundle для AI.
    </p>
    <button class="demo" data-loop-id="basic.cta" data-loop-kind="button" data-loop-title="Primary CTA">
      Попробовать
    </button>
  </main>

  <script src="../loopkit.js"></script>
</body>
</html>
