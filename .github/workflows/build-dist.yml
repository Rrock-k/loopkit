name: Build dist

on:
  push:
    paths:
      - "src/**"
      - "scripts/build.mjs"
      - "package.json"
      - ".github/workflows/build-dist.yml"

permissions:
  contents: write

jobs:
  build-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm run build
      - run: node --check src/loopkit.js
      - run: node --check dist/loopkit.js

      - name: Commit generated runtime
        shell: bash
        run: |
          if git diff --quiet -- src/loopkit.js dist/loopkit.js; then
            echo "runtime files are already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/loopkit.js dist/loopkit.js
          git commit -m "build: update runtime [skip ci]"
          git push
